name: Deploy to VPS

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }} # Only run on main branch to prevent accidental deployments on dev branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image and tag latest
        uses: docker/build-push-action@v7
        with:
          push: false
          file: docker/Dockerfile
          tags: decomp-bot:latest
      - name: Save Docker image to tarball
        run: |
          mkdir -p /tmp/deploy
          docker save decomp-bot:latest | gzip > /tmp/deploy/decomp-bot-latest.tar.gz
      - name: Copy image tarball to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: dev
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          source: /tmp/deploy/decomp-bot-latest.tar.gz
          target: /tmp/deploy
          strip_components: 2
      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: dev
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          source: docker-compose.prod.yml
          target: /opt/docker/decompbot
          strip_components: 0
      - name: Load image and run container on VPS
        uses: appleboy/ssh-action@v1
        env:
          DECOMP_BOT_PATH: /opt/docker/decompbot
        with:
          host: ${{ secrets.VPS_HOST }}
          username: dev
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -e
            TAR=/tmp/deploy/decomp-bot-latest.tar.gz
            if [ ! -f "$TAR" ]; then
              echo "Tarball $TAR not found"
              exit 1
            fi
            docker load -i "$TAR"
            # Ensure docker-compose file is at /opt/docker/decompbot/docker-compose.prod.yml
            if [ ! -f "$DECOMP_BOT_PATH/docker-compose.prod.yml" ]; then
              echo "$DECOMP_BOT_PATH/docker-compose.prod.yml not found, aborting"
              exit 1
            fi
            # Bring down any existing services then start using the prebuilt image
            docker-compose -f "$DECOMP_BOT_PATH/docker-compose.prod.yml" down || true
            docker-compose -f "$DECOMP_BOT_PATH/docker-compose.prod.yml" up -d --remove-orphans --no-build
            docker-compose -f "$DECOMP_BOT_PATH/docker-compose.prod.yml" exec -T -w /usr/src/app decomp bun drizzle-kit push
