services:
  decomp:
    image: decomp-bot:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SNOOPLOGG: "*"
    volumes:
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
